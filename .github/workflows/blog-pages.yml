name: Blog pages

# Builds blog/YYYY-MM-DD/ pages whenever a post is added to blog-data.js.
# Posts dated in the future are built by the nightly Panchang run on their date.
on:
  push:
    branches: [main]
    paths: ["blog-data.js", "tools/blog_pages.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: panchang
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the blog post pages and sitemap
        run: python tools/blog_pages.py .
      - name: Commit and push
        run: |
          git config user.name "Panchang bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Blog pages $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase origin main
          git push origin main
